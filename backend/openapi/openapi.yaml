      summary: Lista versões que utilizaram a fonte
      description: Somente proprietário ou administrador da instituição. Retorna id, caseId, title, version e state,
        sem respostas do caso. Retirada de fonte não apaga histórico.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Lista de vínculos autorizados.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
