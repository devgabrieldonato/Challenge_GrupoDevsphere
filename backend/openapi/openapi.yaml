        in: path
        required: true
        schema:
          type: string
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: devsphere_session
    requestGuard:
      type: apiKey
      in: header
      name: X-PV-Request
      description: Valor 1 em mutações; defesa de origem, não credencial.
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Sessão ausente, inválida ou expirada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Usuário autenticado sem autorização.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado ou não visível ao usuário.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Estado ou versão incompatível com a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Entrada inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Muitas tentativas; aguarde antes de repetir.
      headers:
        Retry-After:
          schema:
            type: integer
  schemas:
    Problem:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      - password
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        className:
          type: string
          maxLength: 80
        professionalRegistration:
          type: string
          maxLength: 80
    PendingRegistration:
      type: object
      required:
      - id
      - userId
      - name
      - email
      - role
      - submittedAt
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        role:
          enum:
          - student
          - teacher
        className:
          type:
          - string
          - 'null'
        professionalRegistration:
          type:
          - string
          - 'null'
        submittedAt:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
        otp:
          type: string
          description: Segundo fator obrigatório para docentes/administradores em produção.
    Session:
      type: object
      required:
      - userId
      - fullName
      - role
      - expiresAt
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        role:
          enum:
          - student
          - teacher
          - admin
        expiresAt:
          type: string
          format: date-time
    ClinicalCaseSummary:
      type: object
      required:
      - id
      - version
      - title
      - status
      properties:
        id:
          type: string
        version:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/ReviewState'
    ClinicalCase:
      type: object
      required:
      - schemaVersion
      - id
      - version
      - status
      - patient
      - learningObjectives
      - items
      - hypotheses
      - outcome
      - references
      properties:
        schemaVersion:
          const: '1.0'
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]*$
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ReviewState'
        patient:
          type: object
          required:
          - displayName
          - age
          - chiefComplaint
          - context
          properties:
            displayName:
              type: string
            age:
              type: integer
              minimum: 0
              maximum: 130
            chiefComplaint:
              type: string
            context:
              type: string
        learningObjectives:
          type: array
          minItems: 1
          items:
            type: string
        items:
          type: array
          minItems: 40
          maxItems: 40
          items:
            $ref: '#/components/schemas/CaseItem'
        hypotheses:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Hypothesis'
        priorityEvidenceIds:
          type: array
          items:
            type: string
        outcome:
          type: object
          required:
          - hypothesisId
          - explanation
          properties:
            hypothesisId:
              type: string
            explanation:
              type: string
        references:
          type: array
          minItems: 1
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        missingData:
          type: array
          items:
            type: string
    CaseItem:
      type: object
      required:
      - id
      - type
      - title
      - answer
      - quality
      - why
      properties:
        id:
          type: string
        type:
          enum:
          - question
          - exam
        title:
          type: string
        answer:
          type: string
        quality:
          type: string
        why:
          type: string
        parent:
          type: string
    Hypothesis:
      type: object
      required:
      - id
      - label
      properties:
        id:
          type: string
        label:
          type: string
    ReviewState:
      enum:
      - draft
      - awaiting_human_review
      - changes_requested
      - approved
      - published
      - rejected
    StructuredCaseInput:
      type: object
      required:
      - title
      - patient
      - chiefComplaint
      - clinicalHistory
      - expectedOutcome
      - learningObjectives
      - references
      properties:
        title:
          type: string
        patient:
          type: object
          additionalProperties: true
        chiefComplaint:
          type: string
        clinicalHistory:
          type: string
        expectedOutcome:
          type: string
        learningObjectives:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
        pedagogicalNotes:
          type: string
    PipelineJob:
      type: object
      required:
      - id
      - documentId
      - operation
      - status
      - result
      - resultAccess
      properties:
        id:
          type: string
        documentId:
          type: string
        operation:
          enum:
          - convert
          - generate
          - budget
        status:
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        attempts:
          type: integer
        maxAttempts:
          type: integer
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        resultAccess:
          enum:
          - available
          - revoked
          description: available indica acesso, não conclusão do trabalho nem aprovação clínica.
        error:
          type:
          - object
          - 'null'
          description: Erros recuperáveis incluem select_fewer_pages, invalid_pages, provider_timeout, generation_truncated, provider_incomplete, provider_invalid_response e provider_busy.
        cancelRequested:
          type: integer
          enum:
          - 0
          - 1
        updatedAt:
          type: string
    GenerationJob:
      type: object
      required:
      - id
      - status
      - createdAt
      - warnings
      - missingData
      properties:
        id:
          type: string
          format: uuid
        status:
          enum:
          - queued
          - validating_source
          - extracting
          - requires_ocr
          - generating
          - validation_failed
          - awaiting_human_review
          - changes_requested
          - approved
          - rejected
          - failed
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        missingData:
          type: array
          items:
            type: string
        generatedCase:
          $ref: '#/components/schemas/ClinicalCase'
    SubmissionReport:
      $ref: ../../docs/schemas/submission-report.schema.json
    SubmissionCreateResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - created
      - status
      - score
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        created:
          type: boolean
          description: Verdadeiro apenas quando esta requisição criou o registro.
        status:
          enum:
          - submitted
          - awaiting_assignment
        score:
          type: object
          additionalProperties: false
          required:
          - initial
          - raw
          - displayed
          properties:
            initial:
              type: integer
            raw:
              type: integer
            displayed:
              type: integer
              minimum: 0
              maximum: 100
    SubmissionStep:
      type: object
      required:
      - sequence
      - itemId
      - type
      - selectedAt
      - answer
      - quality
      - comment
      properties:
        sequence:
          type: integer
          minimum: 1
        itemId:
          type: string
        type:
          enum:
          - question
          - exam
        selectedAt:
          type: string
          format: date-time
        answer:
          type: string
        quality:
          type: string
        comment:
          type: string
    DiagnosticAttempt:
      type: object
      required:
      - sequence
      - hypothesisId
      - justification
      - submittedAt
      - availableEvidenceIds
      properties:
        sequence:
          type: integer
          minimum: 1
        hypothesisId:
          type: string
        justification:
          type: string
        submittedAt:
          type: string
          format: date-time
        availableEvidenceIds:
          type: array
          items:
            type: string
    Submission:
      type: object
      additionalProperties: true
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        status:
          enum:
          - submitted
          - awaiting_assignment
          - awaiting_review
          - reviewed
          - imported
        isTest:
          type: boolean
        scoreAvailable:
          type: boolean
        score:
          type: object
          properties:
            initial:
              type: integer
            raw:
              type: integer
            displayed:
              type: integer
              minimum: 0
              maximum: 100
    TeacherFeedback:
      type: object
      required:
      - strengths
      - difficulties
      - missedEvidence
      - prioritizationComment
      - justificationComment
      - nextAttemptGuidance
      - generalObservation
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        canEdit:
          type: boolean
          readOnly: true
          description: >-
            Metadado opcional da listagem que combina autoria e autorização atual
            sobre o atendimento. É falso para devolutivas concluídas. Orienta a
            interface; cada alteração continua exigindo autorização no servidor.
        strengths:
          type: string
        difficulties:
          type: string
        missedEvidence:
          type: string
        prioritizationComment:
          type: string
        justificationComment:
          type: string
        nextAttemptGuidance:
          type: string
        generalObservation:
          type: string
        status:
          enum:
          - draft
          - completed
    StartClinicalSession:
      type: object
      properties:
        caseKey:
          type: string
        activityId:
          type:
          - integer
          - 'null'
          minimum: 1
      required:
      - caseKey
    ClinicalAction:
      type: object
      properties:
        itemKey:
          type: string
      required:
      - itemKey
    ClinicalHypothesis:
      type: object
      properties:
        hypothesis:
          type: string
        justification:
          type: string
          minLength: 1
          maxLength: 10000
      required:
      - hypothesis
      - justification
    JobRequest:
      type: object
      properties:
        operation:
          enum:
          - convert
          - generate
          - budget
        pages:
          description: Páginas físicas selecionadas; ausente ou lista vazia usa todas as páginas convertidas. Não há truncamento silencioso.
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 1
            maximum: 100
        instructions:
          type: string
          maxLength: 4000
        query:
          type: string
          maxLength: 1000
        idempotencyKey:
          type: string
          maxLength: 128
      required:
      - operation
    CaseContribution:
      type: object
      properties:
        key:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 200
        content:
          type: object
          description: Formato privado canônico com 40 itens e scoring.
        metadata:
          type: object
          description: Área, metadados públicos e classificação docente. Rubrica opcional pv-difficulty-v1 conforme schema externo; confirmação não equivale a aprovação clínica.
          allOf:
          - $ref: ../../docs/schemas/case-contribution.schema.json#/properties/metadata
      required:
      - key
      - title
      - content
      - metadata
    ReviewDecision:
      type: object
      properties:
        action:
          enum:
          - submit
          - start
          - approve
          - publish
          - request_changes
          - reject
          - archive
        note:
          type: string
      required:
      - action
security:
- sessionCookie: []
