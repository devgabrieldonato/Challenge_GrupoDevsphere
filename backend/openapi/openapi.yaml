openapi: 3.1.0
info:
  title: API Paciente Virtual
  version: 2.0.0-next
  description: API C++20 do MVP NEXT_2026. Atendimento autoritativo, casos versionados, curadoria atribuída e fila
    local. Sem certificação clínica ou de segurança.
servers:
- url: /api/v1
tags:
- name: Autenticação
- name: Administração
- name: Casos
- name: Geração de casos
- name: Atendimentos
- name: Devolutivas
paths:
  /auth/login:
    post:
      tags:
      - Autenticação
      summary: Inicia uma sessão segura
      security:
      - requestGuard: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão iniciada; o cookie é emitido pelo servidor.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie HttpOnly, SameSite e Secure em produção.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          description: MFA exigido, inválido/não provisionado, ou origem/header bloqueados.
  /auth/logout:
    post:
      tags:
      - Autenticação
      summary: Encerra a sessão atual
      responses:
        '204':
          description: Sessão encerrada.
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
        requestGuard: []
  /auth/session:
    get:
      tags:
      - Autenticação
      summary: Retorna a sessão atual
      responses:
        '200':
          description: Sessão válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register/{role}:
    post:
      tags:
      - Autenticação
      summary: Solicita uma conta acadêmica institucional
      security:
      - requestGuard: []
      parameters:
      - name: role
        in: path
        required: true
        schema:
          enum:
          - student
          - teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Solicitação pendente de análise administrativa.
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/registrations:
    get:
      tags:
      - Administração
      summary: Lista solicitações pendentes
      responses:
        '200':
          description: Cadastros aguardando decisão.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingRegistration'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/registrations/{requestId}/{decision}:
    post:
      tags:
      - Administração
      summary: Aprova ou recusa uma solicitação
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: decision
        in: path
        required: true
        schema:
          enum:
          - approve
          - reject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Decisão registrada e notificação enfileirada.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - sessionCookie: []
        requestGuard: []
  /admin/configuration:
    get:
      tags:
      - Administração
      summary: Consulta domínios, notificações e contadores administrativos
      responses:
        '200':
          description: Configuração administrativa atual.
        '403':
          $ref: '#/components/responses/Forbidden'
  /cases:
    get:
      tags:
      - Casos
      summary: Lista casos visíveis ao usuário autenticado
      responses:
        '200':
          description: Casos disponíveis.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClinicalCaseSummary'
    post:
      tags:
      - Casos
      summary: Cria um caso em rascunho
      description: Requer papel teacher. Nunca publica automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalCase'
      responses:
        '201':
          description: Rascunho criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClinicalCase'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
        requestGuard: []
  /submissions:
    get:
      tags:
      - Atendimentos
      summary: Lista atendimentos autorizados
      parameters:
      - name: status
        in: query
        schema:
          enum:
          - submitted
          - awaiting_assignment
          - awaiting_review
          - reviewed
      responses:
        '200':
          description: Atendimentos visíveis conforme a sessão.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Atendimentos
      summary: Finaliza e envia o atendimento com seu PDF
      description: Aceita aluno ou administrador. A identidade acadêmica vem da sessão. Professor recebe 403. O
        backend recalcula a pontuação e compara o JSON incorporado no PDF com o campo report. Um retry com a mesma
        chave e o mesmo conteúdo retorna a submissão existente.
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Deve repetir o mesmo UUID enviado em clientSubmissionId.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - clientSubmissionId
              - report
              - pdf
              properties:
                clientSubmissionId:
                  type: string
                  format: uuid
                report:
                  type: string
                  contentMediaType: application/json
                  description: JSON textual conforme submission-report.schema.json v2.
                activityId:
                  type: integer
                  format: int64
                  minimum: 1
                pdf:
                  type: string
                  format: binary
            encoding:
              report:
                contentType: application/json; charset=utf-8
              pdf:
                contentType: application/pdf
      responses:
        '201':
          description: Nova submissão criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreateResponse'
        '200':
          description: Retry idempotente; a submissão existente foi recuperada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreateResponse'
        '400':
          description: Relatório, PDF, atividade ou correspondência entre PDF e JSON inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Renderizador PDF oficial indisponível; configure Python/reportlab e repita com o mesmo protocolo.
      security:
      - sessionCookie: []
        requestGuard: []
  /submissions/import-pdf:
    post:
      tags:
      - Atendimentos
      summary: Importa relatório PDF emitido pela plataforma
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Relatório compatível importado e PDF original preservado.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                properties:
                  id:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum:
                    - imported
        '400':
          description: Tipo
          assinatura ou esquema incompatível.: null
        '413':
          description: Arquivo vazio ou acima de 10 MB.
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
        requestGuard: []
  /submissions/{submissionId}:
    get:
      tags:
      - Atendimentos
      summary: Consulta percurso e tentativas para revisão
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Atendimento encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{submissionId}/pdf:
    get:
      tags:
      - Atendimentos
      summary: Exibe o PDF associado ao atendimento
      description: Disponível ao aluno proprietário, professor responsável e administrador. Para outros usuários,
        responde 404 sem revelar a existência do documento.
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: PDF preservado na conclusão.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: inline; filename="atendimento.pdf"
            ETag:
              schema:
                type: string
              description: Hash SHA-256 do documento.
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /submissions/{submissionId}/feedback:
    post:
      tags:
      - Devolutivas
      summary: Cria devolutiva ou atualiza o próprio rascunho, separado do atendimento original
      parameters:
      - $ref: '#/components/parameters/SubmissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherFeedback'
      responses:
        '201':
          description: Rascunho criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherFeedback'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: A devolutiva pertence a outro docente ou já foi concluída; nenhum conteúdo é alterado.
      security:
      - sessionCookie: []
        requestGuard: []
  /feedback/{feedbackId}:
    put:
      tags:
      - Devolutivas
      summary: Atualiza devolutiva ainda em rascunho
      parameters:
      - $ref: '#/components/parameters/FeedbackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherFeedback'
      responses:
        '200':
          description: Rascunho atualizado.
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
        requestGuard: []
  /feedback/{feedbackId}/complete:
    post:
      tags:
      - Devolutivas
      summary: Conclui a devolutiva
      parameters:
      - $ref: '#/components/parameters/FeedbackId'
      responses:
        '200':
          description: Devolutiva concluída e bloqueada para edição comum.
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - sessionCookie: []
        requestGuard: []
  /students/{studentId}/feedback:
    get:
      tags:
      - Devolutivas
      summary: Lista devolutivas visíveis ao aluno autenticado
      parameters:
      - name: studentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Devolutivas autorizadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherFeedback'
  /health:
    get:
      summary: Health check básico
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      security: []
  /auth/revoke-sessions:
    post:
      summary: Revoga todas as sessões do titular
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      security:
      - sessionCookie: []
        requestGuard: []
  /cases/{caseKey}/public:
    get:
      summary: Metadados e opções sem gabarito
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: caseKey
        in: path
        required: true
        schema:
          type: string
  /clinical-sessions:
    post:
      summary: Inicia prática ou atividade atribuída
      responses:
        '201':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartClinicalSession'
      security:
      - sessionCookie: []
        requestGuard: []
  /clinical-sessions/{sessionId}:
    get:
      summary: Histórico aceito da própria sessão
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
  /clinical-sessions/{sessionId}/actions:
    post:
      summary: Aceita escolha e calcula pontos
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalAction'
      security:
      - sessionCookie: []
        requestGuard: []
  /clinical-sessions/{sessionId}/hypotheses:
    post:
      summary: Registra hipótese e evidências disponíveis
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalHypothesis'
      security:
      - sessionCookie: []
        requestGuard: []
  /notifications:
    get:
      summary: Notificações próprias
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
  /notifications/{notificationId}/read:
    post:
      summary: Marca notificação própria como lida
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
      security:
      - sessionCookie: []
        requestGuard: []
  /contributions:
    get:
      summary: Rascunhos próprios ou atribuídos
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
    post:
      summary: Cria versão em rascunho
      responses:
        '201':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseContribution'
      security:
      - sessionCookie: []
        requestGuard: []
  /contributions/{contributionId}:
    get:
      summary: Consulta versão privada pelo ID da versão
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: contributionId
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Cria nova versão; parâmetro é o ID do caso, não da versão
      responses:
        '201':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: contributionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseContribution'
      security:
      - sessionCookie: []
        requestGuard: []
  /case-versions/{versionId}/review:
    post:
      summary: Revisão atribuída; aprovação e publicação separadas
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      parameters:
      - name: versionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      security:
      - sessionCookie: []
        requestGuard: []
  /admin/reviewer-areas:
    post:
      summary: Habilita ou revoga docente por área
      responses:
        '200':
          description: Operação concluída.
        '400':
          description: Entrada, autorização ou estado incompatível.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflito de estado ou idempotência.
        '429':
          description: Limite de recursos por usuário atingido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                area:
                  type: string
                enabled:
                  type: boolean
                  default: true
                  description: false revoga imediatamente a habilitação; preserva atribuições e pareceres.
                reason:
                  type: string
                  maxLength: 2000
                  description: Contexto administrativo opcional, sem dados clínicos.
              required:
              - userId
              - area
      security:
      - sessionCookie: []
        requestGuard: []
    get:
      summary: Lista habilitações atuais na instituição
      description: Somente administrador. Campos userId, name, email, area e enabledAt.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Lista de vínculos autorizados.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/review-assignments:
    post:
