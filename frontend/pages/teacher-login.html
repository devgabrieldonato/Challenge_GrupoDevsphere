<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Login do professor · Paciente Virtual
    </title>
    <link rel="stylesheet" href="../styles/auth.css">
  </head>
  <body class="app-shell">
    <a class="skip-link" href="#conteudo">
      Ir para o conteúdo
    </a>
    <!-- Cabeçalho persistente com identidade e navegação contextual. -->
    <header class="site-header">
      <div class="brand" aria-label="FIAP">
        FIAP
      </div>
      <div>
        <p class="site-title">
          Paciente Virtual
        </p>
        <p class="site-subtitle">
          Área do professor
        </p>
      </div>
    </header>
    <!-- Conteúdo principal específico desta etapa da jornada. -->
    <main id="conteudo" class="page-main auth-layout">
      <section class="auth-copy" aria-labelledby="page-title">
        <span class="eyebrow">
          Professor
        </span>
        <h1 id="page-title">
          Transforme percursos em devolutivas.
        </h1>
        <p class="muted">
          Acesse as revisões, casos clínicos e ferramentas de autoria.
        </p>
      </section>
      <section class="card auth-card" aria-labelledby="form-title">
        <h2 id="form-title">
          Entrar
        </h2>
        <!-- Formulário de autenticação; a sessão é criada pelo backend em cookie seguro. -->
        <form id="loginForm" data-role="teacher" data-success-url="./teacher-dashboard.html">
          <div class="field">
            <label for="email">
              E-mail institucional
            </label>
            <input id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="password">
              Senha
            </label>
            <div class="password-field">
              <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8">
              <button type="button" data-toggle-password aria-controls="password">
                Mostrar
              </button>
            </div>
          </div>
          <div id="formStatus" role="status" aria-live="polite">
          </div>
          <button class="button primary" type="submit">
            Entrar como professor
          </button>
          <a class="button" href="teacher-register.html">
            Criar conta de professor
          </a>
          <a class="button" href="../index.html">
            Voltar à escolha de perfil
          </a>
        </form>
      </section>
    </main>
    <!-- Controlador da página e integração com os serviços da API. -->
    <script type="module" src="../scripts/auth/login-page.js">
    </script>
  </body>
</html>
